
name: RWX Buildathon Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  local-test:
    name: Local Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run local evaluation
        run: |
          chmod +x evaluate_local.sh
          bash evaluate_local.sh

  docker-test:
    name: Docker Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t rwx-solution .

          - name: Run Docker evaluation
            run: |
              chmod +x evaluate_docker.sh
              ./evaluate_docker.sh
